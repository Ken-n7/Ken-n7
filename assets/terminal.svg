<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 593" width="1016" height="593" role="img" aria-label="GNOME Terminal: whoami, ken. John Kenneth Cañete, developer from the Philippines. I build stuff: web apps, multiplayer games, desktop tools, and the occasional experiment. Builds: lakbayin, probxcape, integrid, swarm-gallery, efp-supply, relivetv, sip-and-savor, tagtune. Status: open to work.">
<style>
